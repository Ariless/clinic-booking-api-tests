# Impact analysis — Claude reads the PR diff and selects which tests to run.
# Runs on every PR to main. Complements the full suite in api-tests.yml:
#   - impact-analysis.yml = fast targeted feedback on PR (AI-selected tests only)
#   - api-tests.yml = full suite gate (runs in parallel, required to merge)
name: Impact Analysis

on:
  pull_request:
    branches: [main]

concurrency:
  group: impact-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: http://127.0.0.1:3000
  DB_PATH: sut/data/clinic.db
  AI_MOCK_RESPONSE: "true"
  RATE_LIMIT_REGISTER_MAX: "1000"

jobs:
  impact:
    name: Impact Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut
          token: ${{ secrets.SUT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sut/package-lock.json

      - name: Get changed files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

      - name: Determine impacted tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/impact-analysis.js

      - name: Show selected tests
        run: |
          echo "Test files selected for this PR:"
          cat impact-tests.txt | tr ' ' '\n' | grep -v '^$' || echo "(none)"

      - name: Start SUT
        if: ${{ hashFiles('impact-tests.txt') != '' }}
        run: |
          mkdir -p sut/data
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose -f sut/docker-compose.test.yml up -d --wait

      - name: SUT logs on failure
        if: failure()
        run: docker compose -f sut/docker-compose.test.yml logs

      - name: Install Playwright
        run: npm ci && npm ci --prefix sut --omit=dev && npx playwright install chromium --with-deps

      - name: Run impacted tests
        id: run_tests
        continue-on-error: true
        run: |
          TESTS=$(cat impact-tests.txt)
          if [ -z "$TESTS" ]; then
            echo "No tests impacted by this PR — skipping test run."
            echo "NO_TESTS=true" >> $GITHUB_ENV
          else
            npx playwright test $TESTS
          fi

      - name: Generate AI CI summary
        if: env.NO_TESTS != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: node scripts/ai-ci-summary.js

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const noTests = process.env.NO_TESTS === 'true';

            let changedFiles = '';
            try { changedFiles = fs.readFileSync('changed-files.txt', 'utf8').trim(); } catch {}

            let impactedTests = '';
            try { impactedTests = fs.readFileSync('impact-tests.txt', 'utf8').trim(); } catch {}
            const testList = impactedTests
              ? impactedTests.split(' ').filter(Boolean).map(t => `  - \`${t}\``).join('\n')
              : '  *(none)*';

            let summary = '';
            try { summary = fs.readFileSync('ci-summary/summary.md', 'utf8'); } catch {}

            const selectedLabel = impactedTests
              ? `${impactedTests.split(' ').filter(Boolean).length} test file(s) selected`
              : 'no tests selected';

            const body = [
              '## 🤖 Impact Analysis',
              '',
              `**${selectedLabel}** based on ${changedFiles.split('\n').filter(Boolean).length} changed file(s).`,
              '',
              '<details><summary>Selected test files</summary>',
              '',
              testList,
              '',
              '</details>',
              '',
              noTests || !summary
                ? '*No tests ran — no impacted test files found for these changes.*'
                : summary,
              '',
              '---',
              '*Powered by Claude Haiku + Playwright JSON reporter.*',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload CI summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: impact-analysis-summary
          path: |
            ci-summary/
            changed-files.txt
            impact-tests.txt
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down || true
