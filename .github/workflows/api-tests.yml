# Playwright suite — smoke gates API + E2E (parallel), merged Allure report on GitHub Pages.
name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs. Needed whenever the code has not changed but the environment
  # has: a rotated SUT_GITHUB_TOKEN, an updated secret, a change on the SUT
  # side. Without this the only way to re-run was an empty commit — which is
  # how an expired token stayed invisible until someone happened to push.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: http://127.0.0.1:3000
  DB_PATH: sut/data/clinic.db
  AI_MOCK_RESPONSE: "true"
  SUT_ROOT: sut
  RATE_LIMIT_REGISTER_MAX: "1000"

# ── Lint ─────────────────────────────────────────────────────────────────────
# Static only: no SUT, no browsers, no database. Kept separate from smoke so a naming
# or dead-code problem is reported as itself instead of as a failed test run. Added
# 2026-08-22, when the repository got its first ESLint config — the SUT had one from
# the start, this repo never did, so its conventions lived only in CLAUDE.md.
jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

# ── Smoke ────────────────────────────────────────────────────────────────────
# Fast gate on every push / PR. API and E2E jobs start only if this passes.
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut
          token: ${{ secrets.SUT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start SUT
        run: |
          mkdir -p sut/data
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose -f sut/docker-compose.test.yml up -d --wait

      - name: SUT logs on failure
        if: failure()
        run: docker compose -f sut/docker-compose.test.yml logs

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: Smoke (@smoke)
        run: npm run test:smoke

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down

# ── API tests ────────────────────────────────────────────────────────────────
# Full tests/api suite. Runs in parallel with E2E after smoke passes.
  api:
    name: API tests
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut
          token: ${{ secrets.SUT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start SUT
        run: |
          mkdir -p sut/data
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose -f sut/docker-compose.test.yml up -d --wait

      - name: SUT logs on failure
        if: failure()
        run: docker compose -f sut/docker-compose.test.yml logs

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      # Fails when a claim the docs make about the suite stops being true —
      # page objects instantiated instead of injected, or counts in
      # docs/FACTS.json drifting from the actual suite.
      - name: Convention and docs drift check
        run: npm run check:conventions

      - name: API tests
        run: npm run test:api

      # One deliberate misconfiguration, on the layer the ai-service job does not cover: the model
      # call itself is aimed at a dead port, and the endpoint has to answer 503 CLAUDE_UNAVAILABLE
      # rather than hang or blame the service in front of it. Runs last in the job because it
      # restarts the SUT into a degraded topology. No API key involved — the request never leaves
      # the runner. Before 2026-08-22 this path had a test and no way to run it (TST-06).
      - name: Degradation — the model is unreachable
        env:
          CLAUDE_DEGRADE: "true"
        run: |
          docker compose -f sut/docker-compose.test.yml -f sut/docker-compose.claude-degrade.yml \
            up -d --wait
          npx playwright test tests/api/ai.recommend.test.ts --grep "Claude unreachable"

      - name: Generate AI CI summary
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: node scripts/ai-ci-summary.js

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload CI summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-api
          path: ci-summary/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down

# ── Invariant contract ───────────────────────────────────────────────────────
# Runs the API layer against a SUT with ASSERT_INVARIANTS on: after every mutating request the
# SUT verifies five cross-table rules and answers 500 INVARIANT_VIOLATED on a breach. The oracle
# reads the database directly, so it covers paths no test targets.
#
# continue-on-error until 2026-08-20: the "zero false positives" figure comes from two local runs
# on one day, which is not enough to gate merges on. Remove the flag once a week of runs is clean —
# leaving it in permanently would make this job decorative.
  invariants:
    name: Invariant contract
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read

    env:
      # Mirrors what the SUT was started with — the suite skips these tests when the SUT cannot
      # serve them, rather than failing on configuration.
      ENABLE_DEBUG_ROUTES: "true"
      ASSERT_INVARIANTS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut
          token: ${{ secrets.SUT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start SUT with the invariant contract on
        run: |
          mkdir -p sut/data
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose -f sut/docker-compose.test.yml -f sut/docker-compose.invariants.yml up -d --wait

      - name: SUT logs on failure
        if: failure()
        run: docker compose -f sut/docker-compose.test.yml -f sut/docker-compose.invariants.yml logs

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      # The oracle must be seen failing before its silence means anything: these tests desync state
      # on purpose via /debug/break-invariant and require the 500.
      - name: Oracle bites on a deliberate breach
        run: npx playwright test tests/api/invariants.test.ts

      - name: API tests under the contract
        run: npm run test:api

      # Green tests only prove no assertion caught a breach. This reads what the SUT itself logged,
      # excluding the two firings the break-invariant tests cause on purpose. Anything left is a
      # real breach on a path no assertion covers — exactly what the oracle exists to surface.
      - name: Report unexpected invariant violations
        if: always()
        run: |
          docker compose -f sut/docker-compose.test.yml -f sut/docker-compose.invariants.yml logs \
            | grep "invariant.violated" \
            | grep -v "break-invariant" > unexpected.log || true
          if [ -s unexpected.log ]; then
            echo "::error::the invariant contract fired outside the deliberate test breach"
            cat unexpected.log
            exit 1
          fi
          echo "No unexpected invariant violations."

      # Deliberately not merged into the published Allure report: this job re-runs the same API
      # suite under a different SUT configuration, and merging would double every test in it.
      # Download the artifact directly when a run needs investigating.
      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-invariants
          path: allure-results/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml -f sut/docker-compose.invariants.yml down


# ── Delegated AI ─────────────────────────────────────────────────────────────
# Runs the API layer against a SUT that delegates the specialty decision to the standalone
# ai-service over HTTP, instead of deciding in-process.
#
# It exists because the alternative was what happened until 2026-08-21: the extraction was recorded
# as done, `callAiService()` had never been written, and the one test that would have noticed
# (503 AI_SERVICE_UNAVAILABLE) guarded on an env var nothing set — so it skipped on every run and the
# missing integration looked accounted for. A topology nothing exercises is a topology nobody can
# claim. Both containers run with AI_MOCK_RESPONSE=true, so no API key is needed.
  ai-service:
    name: Delegated AI service
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      # Mirrors the SUT's launch configuration so the degradation test knows it can run.
      AI_SERVICE_DEGRADE: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut
          token: ${{ secrets.SUT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start SUT with the recommendation delegated
        run: |
          mkdir -p sut/data
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose -f sut/docker-compose.test.yml -f sut/docker-compose.ai-service.yml up -d --wait

      - name: SUT logs on failure
        if: failure()
        run: docker compose -f sut/docker-compose.test.yml -f sut/docker-compose.ai-service.yml logs

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      # The provider side of the contract, verified against the service actually running in this job
      # rather than against a stub of it.
      - name: ai-service satisfies the consumer pact
        env:
          AI_SERVICE_URL: http://localhost:3001
        run: npx playwright test tests/api/pact/ai.service.pact.provider.test.ts

      - name: API tests against the delegated topology
        run: npm run test:api

      # Same suite, one deliberate misconfiguration: the SUT points at a dead port, and the
      # unreachable-service path has to answer 503 AI_SERVICE_UNAVAILABLE rather than time out or
      # blame the model. An error path nobody has watched fire is not an error path.
      - name: Degradation — the service is unreachable
        env:
          AI_SERVICE_DEGRADE: "true"
        run: |
          docker compose -f sut/docker-compose.test.yml -f sut/docker-compose.ai-service.yml \
            stop ai-service
          npx playwright test tests/api/ai.recommend.test.ts --grep "ai-service unreachable"

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ai-service
          path: allure-results/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml -f sut/docker-compose.ai-service.yml down

# ── E2E & UI ─────────────────────────────────────────────────────────────────
# Browser tests (tests/e2e + tests/ui). --pass-with-no-tests keeps the job green
# until those directories are committed. workers:1 for SQLite safety.
  e2e:
    name: E2E & UI
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut
          token: ${{ secrets.SUT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start SUT
        run: |
          mkdir -p sut/data
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose -f sut/docker-compose.test.yml up -d --wait

      - name: SUT logs on failure
        if: failure()
        run: docker compose -f sut/docker-compose.test.yml logs

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: E2E & UI tests (visual excluded — run update-visual-snapshots first)
        run: npx playwright test tests/e2e tests/ui --pass-with-no-tests --grep-invert @visual

      - name: Generate AI CI summary
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: node scripts/ai-ci-summary.js

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload CI summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-e2e
          path: ci-summary/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down

# ── Visual regression ────────────────────────────────────────────────────────
# Runs @visual tests separately. continue-on-error until linux baselines exist —
# run the "Update visual snapshots" workflow once, then remove continue-on-error.
  visual:
    name: Visual regression
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut
          token: ${{ secrets.SUT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start SUT
        run: |
          mkdir -p sut/data
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose -f sut/docker-compose.test.yml up -d --wait

      - name: SUT logs on failure
        if: failure()
        run: docker compose -f sut/docker-compose.test.yml logs

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: Visual tests (@visual)
        run: |
          if ls tests/ui/visual.test.js-snapshots/*-linux.png 2>/dev/null | grep -q .; then
            npm run test:visual
          else
            echo "No linux baselines — skipping. Run 'Update visual snapshots' workflow first."
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down

# ── Allure report ─────────────────────────────────────────────────────────────
# Merges allure-results from all three jobs and deploys to GitHub Pages.
# Runs even if api or e2e failed so the report always reflects the latest run.
  allure-report:
    name: Allure report
    needs: [api, e2e, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Download allure results — smoke
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
        continue-on-error: true

      - name: Download allure results — api
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
        continue-on-error: true

      - name: Download allure results — e2e
        uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results/
        continue-on-error: true

      - name: Restore Allure history from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare history + environment
        run: |
          mkdir -p allure-results
          if [ -d gh-pages/history ]; then
            echo "Restoring Allure history"
            cp -r gh-pages/history allure-results/history
          fi
          printf 'Node.js=%s\nSUT=%s\nBase.URL=%s\n' \
            "$(node --version)" \
            "${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}" \
            "${{ env.BASE_URL }}" \
            > allure-results/environment.properties

      - name: Generate Allure report
        run: npx allure generate allure-results -o allure-report --clean

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          keep_files: false