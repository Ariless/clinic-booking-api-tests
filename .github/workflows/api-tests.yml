# Playwright suite — smoke gates API + E2E (parallel), merged Allure report on GitHub Pages.
name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: http://127.0.0.1:3000
  DB_PATH: sut/data/clinic.db
  AI_MOCK_RESPONSE: "true"
  SUT_ROOT: sut
  RATE_LIMIT_REGISTER_MAX: "1000"

# ── Smoke ────────────────────────────────────────────────────────────────────
# Fast gate on every push / PR. API and E2E jobs start only if this passes.
jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start SUT
        run: |
          mkdir -p sut/data
          docker compose -f sut/docker-compose.test.yml up -d --wait

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: Smoke (@smoke)
        run: npm run test:smoke

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down

# ── API tests ────────────────────────────────────────────────────────────────
# Full tests/api suite. Runs in parallel with E2E after smoke passes.
  api:
    name: API tests
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start SUT
        run: |
          mkdir -p sut/data
          docker compose -f sut/docker-compose.test.yml up -d --wait

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: API tests
        run: npm run test:api

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down

# ── E2E & UI ─────────────────────────────────────────────────────────────────
# Browser tests (tests/e2e + tests/ui). --pass-with-no-tests keeps the job green
# until those directories are committed. workers:1 for SQLite safety.
  e2e:
    name: E2E & UI
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start SUT
        run: |
          mkdir -p sut/data
          docker compose -f sut/docker-compose.test.yml up -d --wait

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: E2E & UI tests (visual excluded — run update-visual-snapshots first)
        run: npx playwright test tests/e2e tests/ui --pass-with-no-tests --grep-invert @visual

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down

# ── Visual regression ────────────────────────────────────────────────────────
# Runs @visual tests separately. continue-on-error until linux baselines exist —
# run the "Update visual snapshots" workflow once, then remove continue-on-error.
  visual:
    name: Visual regression
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start SUT
        run: |
          mkdir -p sut/data
          docker compose -f sut/docker-compose.test.yml up -d --wait

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: Visual tests (@visual)
        run: |
          if ls tests/ui/visual.test.js-snapshots/*-linux.png 2>/dev/null | grep -q .; then
            npm run test:visual
          else
            echo "No linux baselines — skipping. Run 'Update visual snapshots' workflow first."
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down

# ── Allure report ─────────────────────────────────────────────────────────────
# Merges allure-results from all three jobs and deploys to GitHub Pages.
# Runs even if api or e2e failed so the report always reflects the latest run.
  allure-report:
    name: Allure report
    needs: [api, e2e, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Download allure results — smoke
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
        continue-on-error: true

      - name: Download allure results — api
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
        continue-on-error: true

      - name: Download allure results — e2e
        uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results/
        continue-on-error: true

      - name: Restore Allure history from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare history + environment
        run: |
          mkdir -p allure-results
          if [ -d gh-pages/history ]; then
            echo "Restoring Allure history"
            cp -r gh-pages/history allure-results/history
          fi
          printf 'Node.js=%s\nSUT=%s\nBase.URL=%s\n' \
            "$(node --version)" \
            "${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}" \
            "${{ env.BASE_URL }}" \
            > allure-results/environment.properties

      - name: Generate Allure report
        run: npx allure generate allure-results -o allure-report --clean

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          keep_files: false