# OWASP ZAP baseline security scan — manual trigger only.
# Scans the running SUT for OWASP Top 10 vulnerabilities, missing headers,
# and known misconfigurations. Produces an HTML report saved as a CI artifact.
#
# Usage: Actions tab → "Security scan (ZAP)" → Run workflow
name: Security scan (ZAP)

on:
  workflow_dispatch:

env:
  BASE_URL: http://127.0.0.1:3000

jobs:
  zap:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut
          token: ${{ secrets.SUT_GITHUB_TOKEN }}

      - name: Start SUT
        run: |
          mkdir -p sut/data
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose -f sut/docker-compose.test.yml up -d --wait

      - name: Pull ZAP image
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: Run ZAP baseline scan
        run: |
          mkdir -p zap-report
          docker run --rm \
            --network host \
            -v $(pwd)/zap-report:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t ${{ env.BASE_URL }} \
              -r zap-report.html \
              -J zap-report.json \
              -I
        # -I = ignore warnings, only fail on HIGH alerts
        # --network host = reach the SUT on 127.0.0.1:3000

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report/
          if-no-files-found: warn

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down
