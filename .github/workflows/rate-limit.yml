# Rate-limit tests — manual trigger only.
# Restarts the SUT with low per-IP limits, then runs @rate-limit-tagged tests.
# The skip guards in each test file activate only when the env vars are ≤ 5,
# so both the SUT and the test step receive the same override values.
#
# Usage: Actions tab → "Rate-limit tests" → Run workflow
name: Rate-limit tests

on:
  workflow_dispatch:
    inputs:
      login_max:
        description: "RATE_LIMIT_LOGIN_MAX (default 2)"
        default: "2"
        required: false
      register_max:
        description: "RATE_LIMIT_REGISTER_MAX (default 2)"
        default: "2"
        required: false
      booking_max:
        description: "RATE_LIMIT_BOOKING_MAX (default 2)"
        default: "2"
        required: false

env:
  BASE_URL: http://127.0.0.1:3000
  DB_PATH: sut/data/clinic.db
  SUT_ROOT: sut

jobs:
  rate-limit:
    name: Rate-limit (@rate-limit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install & seed SUT
        working-directory: sut
        run: npm ci && npm run db:seed

      - name: Start SUT (low rate limits)
        working-directory: sut
        env:
          RATE_LIMIT_LOGIN_MAX: ${{ github.event.inputs.login_max || '2' }}
          RATE_LIMIT_LOGIN_WINDOW_MS: "5000"
          RATE_LIMIT_REGISTER_MAX: ${{ github.event.inputs.register_max || '2' }}
          RATE_LIMIT_REGISTER_WINDOW_MS: "5000"
          RATE_LIMIT_BOOKING_MAX: ${{ github.event.inputs.booking_max || '2' }}
          RATE_LIMIT_BOOKING_WINDOW_MS: "5000"
        run: |
          npm start > /tmp/sut.log 2>&1 &
          echo $! > /tmp/sut.pid
          for i in $(seq 1 45); do
            if curl -sf "${{ env.BASE_URL }}/health" > /dev/null; then
              echo "SUT ready"; exit 0
            fi
            sleep 1
          done
          echo "=== SUT failed to start ===" && cat /tmp/sut.log && exit 1

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: Rate-limit tests (@rate-limit)
        env:
          RATE_LIMIT_LOGIN_MAX: ${{ github.event.inputs.login_max || '2' }}
          RATE_LIMIT_REGISTER_MAX: ${{ github.event.inputs.register_max || '2' }}
          RATE_LIMIT_BOOKING_MAX: ${{ github.event.inputs.booking_max || '2' }}
        run: npx playwright test --grep @rate-limit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-rate-limit
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: |
          [ -f /tmp/sut.pid ] && kill "$(cat /tmp/sut.pid)" 2>/dev/null || true
