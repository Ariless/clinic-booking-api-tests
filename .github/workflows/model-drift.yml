# Model drift detection — runs the @rag golden dataset weekly against the real Claude API.
# Detects if a Claude model update changed the AI recommendation behavior.
#
# Golden dataset: 5 symptom→specialty cases, threshold ≥ 4/5 correct.
# If behavior drifts (e.g. "knee pain after running" → Neurologist instead of Orthopedist),
# this job fails and the dated artifact shows when the drift started.
#
# Artifacts are retained for 90 days so drift can be traced by comparing weekly results.
name: Model Drift Detection

on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday at 09:00 UTC
  workflow_dispatch:        # manual trigger for on-demand baseline check

concurrency:
  group: model-drift
  cancel-in-progress: false   # never cancel a drift run mid-flight

env:
  BASE_URL: http://127.0.0.1:3000
  DB_PATH: sut/data/clinic.db
  AI_MOCK_RESPONSE: "false"   # real Claude calls — this is the point of drift detection
  RATE_LIMIT_REGISTER_MAX: "1000"

jobs:
  rag-drift:
    name: RAG golden dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut
          token: ${{ secrets.SUT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Skip if no API key
        if: ${{ !secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "ANTHROPIC_API_KEY secret not set — skipping drift run."
          echo "Add the secret to enable weekly model drift detection."
          exit 0

      - name: Start SUT (AI recommendation enabled, real key)
        run: |
          mkdir -p sut/data
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
          ENABLE_AI_RECOMMENDATION=true \
          docker compose -f sut/docker-compose.test.yml up -d --wait

      - name: SUT logs on failure
        if: failure()
        run: docker compose -f sut/docker-compose.test.yml logs

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: Run @rag golden dataset
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLE_AI_RECOMMENDATION: "true"
        run: npx playwright test --grep @rag

      - name: Generate drift summary
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESULTS_PATH: test-results.json
        continue-on-error: true
        run: node scripts/ai-ci-summary.js

      - name: Stamp results with date
        if: always()
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p rag-drift-results
          cp test-results.json rag-drift-results/results-${DATE}.json 2>/dev/null || true
          cp ci-summary/summary.md rag-drift-results/summary-${DATE}.md 2>/dev/null || true
          echo "Run date: ${DATE}" > rag-drift-results/metadata.txt
          echo "Model: claude-haiku-4-5-20251001" >> rag-drift-results/metadata.txt
          echo "Trigger: ${{ github.event_name }}" >> rag-drift-results/metadata.txt

      - name: Upload drift results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-drift-${{ github.run_id }}
          path: rag-drift-results/
          retention-days: 90
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down
