# Model drift detection — runs the @rag golden dataset weekly against the real Claude API.
# Detects if a Claude model update changed the AI recommendation behavior.
#
# Golden dataset: 5 symptom→specialty cases, threshold ≥ 4/5 correct.
# If behavior drifts (e.g. "knee pain after running" → Neurologist instead of Orthopedist),
# this job fails and the dated artifact shows when the drift started.
#
# Artifacts are retained for 90 days so drift can be traced by comparing weekly results.
name: Model Drift Detection

on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday at 09:00 UTC
  workflow_dispatch:        # manual trigger for on-demand baseline check
    inputs:
      model:
        description: "Model id to sweep (blank = the default in config/models.json)"
        required: false
        type: string

concurrency:
  group: model-drift
  cancel-in-progress: false   # never cancel a drift run mid-flight

env:
  BASE_URL: http://127.0.0.1:3000
  DB_PATH: sut/data/clinic.db
  # The SUT is checked out *inside* this repo (`path: sut`); on a dev machine the two are siblings.
  # The unit tests fall back to `../../../sut`, which on the runner resolves outside the workspace —
  # so without this the whole suite fails at collection time, before a single @rag test runs.
  SUT_ROOT: sut
  AI_MOCK_RESPONSE: "false"   # real Claude calls — this is the point of drift detection
  RATE_LIMIT_REGISTER_MAX: "1000"
  # Blank on the schedule, set by hand to sweep. Read by both the SUT (ANTHROPIC_MODEL, via compose)
  # and the suite (CLAUDE_MODEL, via config/models.ts), so one value moves the whole run.
  CLAUDE_MODEL: ${{ inputs.model || '' }}
  # `secrets` is not a valid context inside `if:` — a workflow that references it there fails to
  # start at all, so every push produced a red run with no jobs. Resolve the secret to a boolean
  # here, where the context is allowed, and gate the steps on `env` instead.
  HAS_AI_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

jobs:
  rag-drift:
    name: RAG golden dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_GITHUB_REPOSITORY || 'Ariless/clinic-booking-api' }}
          path: sut
          token: ${{ secrets.SUT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sut/package-lock.json

      - name: Skip if no API key
        if: env.HAS_AI_KEY != 'true'
        run: |
          echo "::notice::ANTHROPIC_API_KEY secret not set — the drift run is skipped."
          echo "Add the secret to enable weekly model drift detection."

      # Was: the same three variables exported here, with `docker-compose.test.yml` hardcoding
      # AI_MOCK_RESPONSE: "true" and never mentioning ANTHROPIC_API_KEY. Exported variables reach the
      # compose process, not the container — so this job brought up a SUT in mock mode and had been
      # reporting "no drift" against answers assembled from retrieval, weekly, without ever calling a
      # model. The compose file now references them; the gate below is what makes the mistake
      # impossible to repeat silently.
      - name: Start SUT (AI recommendation enabled, real key)
        if: env.HAS_AI_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.model || '' }}
          AI_MOCK_RESPONSE: "false"
          ENABLE_AI_RECOMMENDATION: "true"
        run: |
          mkdir -p sut/data
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose -f sut/docker-compose.test.yml up -d --wait

      # The SUT reports which of the three recommendation paths it is on. "mock" here means the run
      # would measure retrieval, not the model — the exact failure this job spent months in.
      - name: Fail unless the SUT is really calling the model
        if: env.HAS_AI_KEY == 'true'
        run: |
          IMPL=$(curl -sf "$BASE_URL/health" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).checks.ai.implementation))")
          echo "AI implementation: $IMPL"
          if [ "$IMPL" != "claude" ]; then
            echo "::error::SUT is on '$IMPL', not 'claude' — a drift run against mock answers measures nothing."
            exit 1
          fi

      - name: SUT logs on failure
        if: failure() && env.HAS_AI_KEY == 'true'
        run: docker compose -f sut/docker-compose.test.yml logs

      - name: Install Playwright
        if: env.HAS_AI_KEY == 'true'
        run: npm ci && npm ci --prefix sut --omit=dev && npx playwright install chromium --with-deps

      - name: Run @rag golden dataset
        if: env.HAS_AI_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLE_AI_RECOMMENDATION: "true"
        run: npx playwright test --grep @rag

      - name: Generate drift summary
        if: always() && env.HAS_AI_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESULTS_PATH: test-results.json
        continue-on-error: true
        run: node scripts/ai-ci-summary.js

      - name: Stamp results with date
        if: always() && env.HAS_AI_KEY == 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p rag-drift-results
          cp test-results.json rag-drift-results/results-${DATE}.json 2>/dev/null || true
          cp ci-summary/summary.md rag-drift-results/summary-${DATE}.md 2>/dev/null || true
          echo "Run date: ${DATE}" > rag-drift-results/metadata.txt
          node -e "console.log('Model: ' + (process.env.CLAUDE_MODEL || require('./config/models.json').subject))" >> rag-drift-results/metadata.txt
          echo "Trigger: ${{ github.event_name }}" >> rag-drift-results/metadata.txt

      - name: Upload drift results
        if: always() && env.HAS_AI_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rag-drift-${{ github.run_id }}
          path: rag-drift-results/
          retention-days: 90
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f sut/docker-compose.test.yml down
